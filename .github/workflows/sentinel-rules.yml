name: Sentinel Rules security scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan with Sentinel Rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload findings to this repository's Security tab (code scanning).
      security-events: write
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v5

      - name: Scan
        # Sentinel Rules v0.2.0 (the commit the v0.2.0 tag points to), from the
        # GitHub Marketplace. Pinned to the SHA so a moved tag cannot change CI.
        uses: Hemanth2709/SentinelRules@3b00ec664028bdd6885b1e33a97b0726598c1c01 # v0.2.0
        with:
          # Fail on any finding, ERROR or WARNING, as before.
          fail-on: warning
          # Pull requests from forks get a read-only token and cannot upload.
          upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          category: sentinel-rules
